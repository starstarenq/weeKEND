<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로컬 이징(Easing) 곡선 시뮬레이터</title>
    <style>
        :root {
            --bg-color: #1e1e24;
            --card-color: #2a2a35;
            --accent-color: #4f46e5;
            --text-color: #f3f4f6;
        }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 800px;
            background: var(--card-color);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { margin-top: 0; font-size: 24px; text-align: center; }
        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #a1a1aa; }
        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #4b5563;
            background: #1f2937;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }
        .sandbox {
            background: #111827;
            height: 120px;
            position: relative;
            border-radius: 12px;
            margin-bottom: 25px;
            overflow: hidden;
            border: 1px solid #374151;
        }
        .ball {
            width: 40px;
            height: 40px;
            background: var(--accent-color);
            border-radius: 50%;
            position: absolute;
            top: 40px;
            left: 20px;
            box-shadow: 0 0 15px rgba(79, 70, 229, 0.6);
        }
        .btn-box { text-align: center; }
        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #4338ca; }
    </style>
</head>
<body>

<div class="container">
    <h1>Easing 함수 시뮬레이터</h1>
    
    <div class="control-panel">
        <div>
            <label for="easing-select">이징 함수 선택</label>
            <select id="easing-select">
                <option value="linear">Linear (일정하게)</option>
                <option value="easeInQuad">EaseIn Quad (점점 빠르게)</option>
                <option value="easeOutQuad">EaseOut Quad (점점 느리게)</option>
                <option value="easeInOutQuad">EaseInOut Quad (느리다 빨라지다 느리게)</option>
                <option value="easeInElastic">EaseIn Elastic (튕기며 시작)</option>
                <option value="easeOutElastic">EaseOut Elastic (튕기며 종료)</option>
                <option value="easeOutBounce">EaseOut Bounce (바닥에 튀듯이)</option>
            </select>
        </div>
        <div>
            <label for="duration-input">재생 시간 (초)</label>
            <input type="number" id="duration-input" value="1.5" step="0.1" min="0.1">
        </div>
    </div>

    <div class="sandbox">
        <div class="ball" id="target-ball"></div>
    </div>

    <div class="btn-box">
        <button onclick="startAnimation()">시뮬레이션 실행</button>
    </div>
</div>

<script>
    // 수학적 이징 공식 정의
    const easingFunctions = {
        linear: t => t,
        easeInQuad: t => t * t,
        easeOutQuad: t => t * (2 - t),
        easeInOutQuad: t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t,
        easeInElastic: t => t === 0 ? 0 : t === 1 ? 1 : -Math.pow(2, 10 * t - 10) * Math.sin((t * 10 - 10.75) * ((2 * Math.PI) / 3)),
        easeOutElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1,
        easeOutBounce: t => {
            const n1 = 7.5625;
            const d1 = 2.75;
            if (t < 1 / d1) return n1 * t * t;
            else if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
            else if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
            else return n1 * (t -= 2.625 / d1) * t + 0.984375;
        }
    };

    let animationFrameId = null;

    function startAnimation() {
        const ball = document.getElementById('target-ball');
        const easingType = document.getElementById('easing-select').value;
        const duration = parseFloat(document.getElementById('duration-input').value) * 1000;
        const easingFunc = easingFunctions[easingType];
        
        const startLeft = 20; 
        const endLeft = ball.parentElement.clientWidth - 60; // 끝 지점 계산
        const startTime = performance.now();

        if (animationFrameId) cancelAnimationFrame(animationFrameId);

        function update(currentTime) {
            const elapsedTime = currentTime - startTime;
            let progress = Math.min(elapsedTime / duration, 1); // 0 ~ 1 사이 비율

            // 이징 공식 적용
            const easedProgress = easingFunc(progress);

            // 위치 반영
            const currentPosition = startLeft + (endLeft - startLeft) * easedProgress;
            ball.style.left = `${currentPosition}px`;

            if (progress < 1) {
                animationFrameId = requestAnimationFrame(update);
            }
        }

        animationFrameId = requestAnimationFrame(update);
    }
</script>

</body>
</html>
