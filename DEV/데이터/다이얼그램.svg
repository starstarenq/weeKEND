<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background-color: #0b0b11; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans KR', 'Malgun Gothic', sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b11"/>
      <stop offset="100%" stop-color="#181826"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="gmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38"/>
      <stop offset="100%" stop-color="#141428"/>
    </linearGradient>

    <linearGradient id="emoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1b3d"/>
      <stop offset="100%" stop-color="#161833"/>
    </linearGradient>

    <linearGradient id="playerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="monsterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>

    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Divine Intervention Gradients -->
    <linearGradient id="cosmoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="ocyusisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="960" y="55" text-anchor="middle" fill="#f8fafc" font-size="32" font-weight="800" letter-spacing="1">회고인생 : 실시간 심리스 배틀 시스템 아키텍처 다이어그램</text>
  <text x="960" y="90" text-anchor="middle" fill="#94a3b8" font-size="18" font-weight="500">1920×1080 고해상도 규격 | ES6 독립 모듈 파이프라인 &amp; 신족 간섭 매커니즘 구조도</text>

  <!-- ==================== PLAYER (LEFT TOP) ==================== -->
  <g filter="url(#shadow)">
    <rect x="80" y="130" width="420" height="250" rx="16" fill="url(#playerGrad)" stroke="#6366f1" stroke-width="2"/>
    <rect x="80" y="130" width="420" height="50" rx="16" fill="#6366f1" fill-opacity="0.3"/>
    <text x="290" y="162" text-anchor="middle" fill="#a5b4fc" font-size="20" font-weight="700">Player (주인공 엔티티)</text>

    <rect x="100" y="195" width="380" height="165" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#334155"/>
    <text x="120" y="225" fill="#93c5fd" font-size="16" font-weight="700">• hp / maxHp:</text>
    <text x="250" y="225" fill="#e2e8f0" font-size="16">기본 1250 / 1250</text>
    
    <text x="120" y="255" fill="#93c5fd" font-size="16" font-weight="700">• ultLeft / ultMax:</text>
    <text x="270" y="255" fill="#e2e8f0" font-size="16">궁극기 잔여 횟수 (3/3)</text>

    <text x="120" y="290" fill="#818cf8" font-size="15" font-weight="700">메서드 연산:</text>
    <text x="120" y="315" fill="#cbd5e1" font-size="14">takeDamage(amount) / heal(amount)</text>
    <text x="120" y="338" fill="#cbd5e1" font-size="14">useUltimate() / isDead()</text>
  </g>

  <!-- ==================== MONSTER (LEFT BOTTOM) ==================== -->
  <g filter="url(#shadow)">
    <rect x="80" y="410" width="420" height="250" rx="16" fill="url(#monsterGrad)" stroke="#f43f5e" stroke-width="2"/>
    <rect x="80" y="410" width="420" height="50" rx="16" fill="#f43f5e" fill-opacity="0.3"/>
    <text x="290" y="442" text-anchor="middle" fill="#fda4af" font-size="20" font-weight="700">Monster (필드 인물 엔티티)</text>

    <rect x="100" y="475" width="380" height="165" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#334155"/>
    <text x="120" y="505" fill="#fca5a5" font-size="16" font-weight="700">• hostile:</text>
    <text x="200" y="505" fill="#e2e8f0" font-size="15">적대 상태 (기본 false: 비선공)</text>
    
    <text x="120" y="535" fill="#fca5a5" font-size="16" font-weight="700">• instances:</text>
    <text x="215" y="535" fill="#cbd5e1" font-size="14">mob-1(300), mob-2(450), mob-3(600)</text>

    <text x="120" y="570" fill="#f43f5e" font-size="15" font-weight="700">메서드 연산:</text>
    <text x="120" y="595" fill="#cbd5e1" font-size="14">becomeHostile() - 심리스 적대화</text>
    <text x="120" y="618" fill="#cbd5e1" font-size="14">takeDamage(amount) - 랙돌 물리 연출</text>
  </g>

  <!-- ==================== CONTROLLER (CENTER) ==================== -->
  <g filter="url(#shadow)">
    <rect x="540" y="130" width="840" height="530" rx="16" fill="url(#gmGrad)" stroke="#6366f1" stroke-width="2"/>
    <rect x="540" y="130" width="840" height="50" rx="16" fill="#4f46e5" fill-opacity="0.3"/>
    <text x="960" y="162" text-anchor="middle" fill="#818cf8" font-size="22" font-weight="700">GameManager (중추 코어 컨트롤러)</text>
    
    <!-- Left Column: Properties -->
    <rect x="565" y="195" width="380" height="440" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#334155"/>
    <text x="585" y="225" fill="#818cf8" font-size="17" font-weight="700">📊 코어 상태 변수 (State Properties)</text>
    
    <text x="595" y="260" fill="#e2e8f0" font-size="15" font-weight="700">• crystals: <tspan fill="#fbbf24">보유 데스 크리스탈 (DC)</tspan></text>
    <text x="595" y="295" fill="#e2e8f0" font-size="15" font-weight="700">• isCombat: <tspan fill="#34d399">실시간 전투 여부 (true/false)</tspan></text>
    <text x="595" y="330" fill="#e2e8f0" font-size="15" font-weight="700">• targetMobId: <tspan fill="#f87171">현재 록온된 Monster ID</tspan></text>
    <text x="595" y="365" fill="#e2e8f0" font-size="15" font-weight="700">• combatInterval: <tspan fill="#60a5fa">몬스터 실시간 공격 틱 (1.5s)</tspan></text>

    <line x1="585" y1="395" x2="925" y2="395" stroke="#334155" stroke-width="1"/>

    <text x="585" y="425" fill="#818cf8" font-size="17" font-weight="700">🔄 서브 모듈 바인딩 (Module Sub-Instances)</text>
    <text x="595" y="460" fill="#cbd5e1" font-size="15">• this.player = new Player()</text>
    <text x="595" y="495" fill="#cbd5e1" font-size="15">• this.emotionSystem = new EmotionSystem()</text>
    <text x="595" y="530" fill="#cbd5e1" font-size="15">• this.monsters = { mob-1, mob-2, mob-3 }</text>

    <!-- Right Column: Methods -->
    <rect x="970" y="195" width="380" height="440" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#334155"/>
    <text x="990" y="225" fill="#818cf8" font-size="17" font-weight="700">⚙️ 핵심 게임 루프 로직 (Core Logic)</text>

    <text x="995" y="260" fill="#60a5fa" font-size="15" font-weight="700">startCombatWith(mobId)</text>
    <text x="1010" y="282" fill="#94a3b8" font-size="13">심리스 배틀 진입, 신족 간섭 판정, 틱 루프 시작</text>

    <text x="995" y="315" fill="#60a5fa" font-size="15" font-weight="700">executeBasicAttack() / executeEvasion()</text>
    <text x="1010" y="337" fill="#94a3b8" font-size="13">타격 연산 (코스모 버프 반영) / Shift 회피 및 회복</text>

    <text x="995" y="370" fill="#c084fc" font-size="15" font-weight="700">executeUltimate()</text>
    <text x="1010" y="392" fill="#94a3b8" font-size="13">스킬 Q 광역 250 대미지 &amp; 화면 플래시 연출</text>

    <text x="995" y="425" fill="#60a5fa" font-size="15" font-weight="700">startMonsterTickLoop()</text>
    <text x="1010" y="447" fill="#94a3b8" font-size="13">1.5초 주기 적 공격 연산 (오큐시스/감정 난이도 적용)</text>

    <text x="995" y="480" fill="#34d399" font-size="15" font-weight="700">findNextHostileTarget() / endCombat()</text>
    <text x="1010" y="502" fill="#94a3b8" font-size="13">자동 타겟 록온 전환 및 전투 승리/사망 리셋</text>

    <text x="995" y="535" fill="#38bdf8" font-size="15" font-weight="700">updateUI() / log(message)</text>
    <text x="1010" y="557" fill="#94a3b8" font-size="13">실시간 DOM 체력/감정바 갱신 및 콘솔 로그 출력</text>
  </g>

  <!-- ==================== EMOTION SYSTEM (RIGHT) ==================== -->
  <g filter="url(#shadow)">
    <rect x="1420" y="130" width="420" height="530" rx="16" fill="url(#emoGrad)" stroke="#a855f7" stroke-width="2"/>
    <rect x="1420" y="130" width="420" height="50" rx="16" fill="#a855f7" fill-opacity="0.3"/>
    <text x="1630" y="162" text-anchor="middle" fill="#c084fc" font-size="22" font-weight="700">EmotionSystem (감정/신족)</text>

    <!-- Gauge Info -->
    <rect x="1445" y="195" width="370" height="115" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#334155"/>
    <text x="1465" y="225" fill="#f472b6" font-size="16" font-weight="700">💖 감정 수치 게이지 (0 ~ 100)</text>
    <text x="1475" y="252" fill="#f87171" font-size="14" font-weight="600">&lt; 30 (불행): 피격 대미지 1.2배 (난이도 상승)</text>
    <text x="1475" y="277" fill="#60a5fa" font-size="14" font-weight="600">&gt; 70 (행복): 피격 대미지 0.8배 (난이도 하락)</text>
    <text x="1475" y="298" fill="#94a3b8" font-size="12">기본값: 50 (평온, 1.0배) | 게이지 범주: 10 ~ 90</text>

    <!-- Divine Intervention Sub-box -->
    <rect x="1445" y="325" width="370" height="310" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#334155"/>
    <text x="1465" y="355" fill="#c084fc" font-size="16" font-weight="700">⚡ 신족의 간섭 매커니즘 (Divine Intervention)</text>

    <!-- Ocyusis Card -->
    <rect x="1460" y="370" width="340" height="80" rx="8" fill="url(#ocyusisGrad)" stroke="#ef4444" stroke-width="1"/>
    <text x="1475" y="395" fill="#fca5a5" font-size="15" font-weight="700">😈 악마 오큐시스의 장난</text>
    <text x="1475" y="418" fill="#e2e8f0" font-size="13">• 발동 확률: (100 - 감정수치) %</text>
    <text x="1475" y="438" fill="#e2e8f0" font-size="13">• 효과: 몬스터 공격력 +30% 버프, 감정 -15 차감</text>

    <!-- Cosmo Card -->
    <rect x="1460" y="460" width="340" height="80" rx="8" fill="url(#cosmoGrad)" stroke="#3b82f6" stroke-width="1"/>
    <text x="1475" y="485" fill="#93c5fd" font-size="15" font-weight="700">😇 천사 코스모의 가호</text>
    <text x="1475" y="508" fill="#e2e8f0" font-size="13">• 발동 확률: 40% 고정 확률</text>
    <text x="1475" y="528" fill="#e2e8f0" font-size="13">• 효과: 주인공 공격력 +20% 버프, 감정 +15 증가</text>

    <!-- Cancel Mechanism Notice -->
    <rect x="1460" y="550" width="340" height="70" rx="8" fill="#312e81" fill-opacity="0.6" stroke="#818cf8"/>
    <text x="1630" y="575" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">⚠️ [기획 예외 규정] 동시 중복 발동 시</text>
    <text x="1630" y="600" text-anchor="middle" fill="#e2e8f0" font-size="13">두 효과가 충돌하여 서로 상쇄(무효화) 처리됨</text>
  </g>

  <!-- ==================== UI / VIEW LAYER (BOTTOM) ==================== -->
  <g filter="url(#shadow)">
    <rect x="80" y="690" width="1760" height="340" rx="16" fill="url(#uiGrad)" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="80" y="690" width="1760" height="50" rx="16" fill="#0ea5e9" fill-opacity="0.2"/>
    <text x="960" y="722" text-anchor="middle" fill="#38bdf8" font-size="22" font-weight="700">View &amp; User Interaction Layer (game.html / DOM 이벤트 마운트 레이어)</text>

    <!-- Sub components of UI -->
    <!-- 1. Emotion Bar -->
    <rect x="110" y="755" width="520" height="120" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="130" y="785" fill="#38bdf8" font-size="16" font-weight="700">1. 감정 게이지 &amp; 신족 상태바 컴포넌트</text>
    <text x="140" y="812" fill="#cbd5e1" font-size="14">• #emotion-gauge (상태바 너비 % 가변 연동)</text>
    <text x="140" y="835" fill="#cbd5e1" font-size="14">• #gauge-text (현재 감정 수치 및 상태 설명 표시)</text>
    <text x="140" y="858" fill="#cbd5e1" font-size="14">• #cosmo-status / #ocyusis-status (신족 실시간 텍스트/배경)</text>

    <!-- 2. Battle Field -->
    <rect x="660" y="755" width="600" height="120" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="680" y="785" fill="#38bdf8" font-size="16" font-weight="700">2. 실시간 심리스 배틀 필드 (#battle-field)</text>
    <text x="690" y="812" fill="#cbd5e1" font-size="14">• #player (주인공 위치 및 타격 시 scale 피격 애니메이션)</text>
    <text x="690" y="835" fill="#cbd5e1" font-size="14">• #mob-1, #mob-2, #mob-3 (인물 선택 및 translate/rotate 랙돌 연출)</text>
    <text x="690" y="858" fill="#cbd5e1" font-size="14">• onclick 마운트: window.game.startCombatWith(mobId)</text>

    <!-- 3. Control Panel -->
    <rect x="1290" y="755" width="520" height="120" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="1310" y="785" fill="#38bdf8" font-size="16" font-weight="700">3. 유저 제어 패널 &amp; 실시간 로그</text>
    <text x="1320" y="812" fill="#cbd5e1" font-size="14">• #hp-fill, #hp-text, #crystal-count, #ult-count 바인딩</text>
    <text x="1320" y="835" fill="#cbd5e1" font-size="14">• #log-box (자동 터미널 스크롤 형태의 실시간 전투 로그)</text>
    <text x="1320" y="858" fill="#cbd5e1" font-size="14">• 일반공격(Click) / 회피(Shift) / 궁극기(Q) 스킬 버튼 입력</text>

    <!-- Flow Description inside UI -->
    <rect x="110" y="890" width="1700" height="120" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="130" y="918" fill="#fbbf24" font-size="16" font-weight="700">🔄 실시간 심리스 전투 프로세스 흐름 (Realtime Seamless Battle Flow)</text>
    
    <!-- Flow steps -->
    <g>
      <!-- Step 1 -->
      <rect x="140" y="932" width="360" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="320" y="957" text-anchor="middle" font-size="15" font-weight="700" fill="#60a5fa">1. 인물 선택 선제 공격 (L-Click)</text>
      <text x="320" y="978" text-anchor="middle" font-size="13" fill="#94a3b8">startCombatWith() 심리스 전투 모드 가동</text>

      <path d="M 500 962 L 535 962" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-purple)"/>

      <!-- Step 2 -->
      <rect x="540" y="932" width="360" height="60" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
      <text x="720" y="957" text-anchor="middle" font-size="15" font-weight="700" fill="#c084fc">2. 신족 간섭 랜덤 난수 판정</text>
      <text x="720" y="978" text-anchor="middle" font-size="13" fill="#94a3b8">triggerDivineIntervention() (오큐시스/코스모)</text>

      <path d="M 900 962 L 935 962" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-red)"/>

      <!-- Step 3 -->
      <rect x="940" y="932" width="360" height="60" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <text x="1120" y="957" text-anchor="middle" font-size="15" font-weight="700" fill="#f87171">3. 실시간 몬스터 역공 틱 루프</text>
      <text x="1120" y="978" text-anchor="middle" font-size="13" fill="#94a3b8">startMonsterTickLoop() (1.5초 주기 피격)</text>

      <path d="M 1300 962 L 1335 962" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-green)"/>

      <!-- Step 4 -->
      <rect x="1340" y="932" width="340" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="1510" y="957" text-anchor="middle" font-size="15" font-weight="700" fill="#34d399">4. 플레이어 대응 &amp; 정화 보상</text>
      <text x="1510" y="978" text-anchor="middle" font-size="13" fill="#94a3b8">기본타격/회피/궁극기, 데스 크리스탈 수급</text>
    </g>
  </g>

  <!-- ==================== CONNECTING ARROWS ==================== -->
  <!-- Player -> GameManager -->
  <path d="M 500 255 L 540 255" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>

  <!-- Monster -> GameManager -->
  <path d="M 500 535 L 540 535" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>

  <!-- EmotionSystem <-> GameManager -->
  <path d="M 1380 255 L 1420 255" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 1420 380 L 1380 380" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- GameManager -> View/UI -->
  <path d="M 960 660 L 960 690" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- View -> GameManager (User Inputs) -->
  <path d="M 720 690 L 720 660" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>

</svg>
