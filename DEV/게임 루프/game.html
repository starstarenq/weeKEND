<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Stage Survival Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            background-color: #111;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 20px;
            box-sizing: border-box;
        }

        .ui-element {
            position: absolute;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
            border: 1px solid #444;
        }

        #fps-counter {
            top: 20px;
            right: 20px;
            color: #00ffcc;
        }

        #stage-timer {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffcc00;
            font-size: 1.2rem;
        }

        #player-stats {
            bottom: 20px;
            left: 20px;
            color: #ff4d4d;
        }

        #skill-status {
            bottom: 65px;
            left: 20px;
            color: #ff00ff;
        }

        #action-log {
            bottom: 20px;
            right: 20px;
            color: #ffcc00;
            text-align: right;
            max-height: 150px;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse;
        }

        /* 모달 overlay 스타일 */
        .overlay-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .overlay-screen h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1.2rem;
            background: #00ffcc;
            color: #111;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            pointer-events: auto;
            margin: 8px;
            min-width: 160px;
        }

        .btn:hover {
            background: #00ccaa;
            transform: scale(1.05);
        }

        .difficulty-btn {
            background: #ffcc00;
            color: #111;
        }

        .difficulty-btn:hover {
            background: #e6b800;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <svg id="gameCanvas" width="800" height="600">
            <defs>
                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222" stroke-width="1" />
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid)" />
            <g id="render-group"></g>
        </svg>

        <div id="ui-layer">
            <div id="fps-counter" class="ui-element">FPS: 0</div>
            <div id="stage-timer" class="ui-element">STAGE 1 - 01:00</div>
            <div id="skill-status" class="ui-element">궁극기(Q): 3/3 | 대시(Shift): READY</div>
            <div id="player-stats" class="ui-element">HP: 100 / 100</div>
            <div id="action-log" class="ui-element">게임 준비 완료!</div>
        </div>

        <!-- 1. 난이도 선택 화면 -->
        <div id="difficulty-select-screen" class="overlay-screen" style="display: flex;">
            <h1 style="color: #00ffcc;">난이도 선택</h1>
            <div>
                <button class="btn difficulty-btn" onclick="selectDifficulty('EASY')">쉬움</button>
                <button class="btn difficulty-btn" onclick="selectDifficulty('NORMAL')">보통</button>
                <button class="btn difficulty-btn" onclick="selectDifficulty('HARD')">어려움</button>
            </div>
        </div>

        <!-- 2. 게임 오버 화면 -->
        <div id="game-over-screen" class="overlay-screen">
            <h1 style="color: #ff4d4d;">GAME OVER</h1>
            <button class="btn" onclick="retryCurrentStage()">현재 스테이지 재시도</button>
            <button class="btn" onclick="showDifficultySelect()">난이도 재선택</button>
        </div>

        <!-- 3. 스테이지 클리어 화면 -->
        <div id="stage-clear-screen" class="overlay-screen">
            <h1 style="color: #00ffcc;">STAGE CLEAR!</h1>
            <p id="clear-message" style="font-size: 1.5rem; margin-bottom: 20px;">1분간 생존에 성공했습니다!</p>
            <button class="btn" onclick="nextStage()">다음 스테이지</button>
        </div>
    </div>

    <!-- 외부 스크립트 로드 -->
    <script src="level.js"></script>
    <script src="skill.js"></script>
    <script src="dash.js"></script>
    <script src="takedamage.js"></script>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const renderGroup = document.getElementById('render-group');
        const fpsCounter = document.getElementById('fps-counter');
        const playerStats = document.getElementById('player-stats');
        const skillStatusUI = document.getElementById('skill-status');
        const actionLog = document.getElementById('action-log');
        const stageTimerUI = document.getElementById('stage-timer');

        const difficultySelectScreen = document.getElementById('difficulty-select-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const stageClearScreen = document.getElementById('stage-clear-screen');

        const WIDTH = 800;
        const HEIGHT = 600;

        const TOTAL_STAGES = 5;
        const SURVIVAL_TIME = 60;
        let currentStage = 1;
        let stageTimer = SURVIVAL_TIME;
        let stageTimeAccumulator = 0;

        let isGameRunning = false;
        let isGameOver = false;
        let lastTime = 0;
        let accumulator = 0;
        const timeStep = 1000 / 60;

        let fps = 0;
        let frameCount = 0;
        let fpsLastTime = 0;

        const input = {
            w: false, a: false, s: false, d: false,
            mouseLeft: false,
            q: false,
            shift: false,
            skills: { 1: false, 2: false, 3: false, 4: false, 5: false }
        };

        let player = {
            x: WIDTH / 2,
            y: HEIGHT / 2,
            radius: 15,
            baseSpeed: 4,
            speed: 4,
            hp: 100,
            maxHp: 100,
            pulseTimer: 0
        };

        let monsters = [];
        let projectiles = [];
        let particles = [];

        const monsterSpawner = {
            spawnRate: 1500,
            lastSpawnTime: 0,
            update: function (currentTime) {
                if (currentTime - this.lastSpawnTime >= this.spawnRate) {
                    this.spawn();
                    this.lastSpawnTime = currentTime;
                    if (this.spawnRate > 300) this.spawnRate -= 15;
                }
            },
            spawn: function () {
                const config = window.levelManager.getDifficultyConfig();
                const corners = [
                    { x: 20, y: 20 },
                    { x: WIDTH - 20, y: 20 },
                    { x: 20, y: HEIGHT - 20 },
                    { x: WIDTH - 20, y: HEIGHT - 20 }
                ];

                const spawnPoint = corners[Math.floor(Math.random() * corners.length)];
                const speedBoost = (currentStage - 1) * 0.3;
                const baseSpeed = (1.5 + Math.random() * 1.0 + speedBoost) * config.speedModifier;

                const monster = {
                    id: Date.now() + Math.random(),
                    x: spawnPoint.x,
                    y: spawnPoint.y,
                    radius: 12,
                    speed: baseSpeed,
                    attackRate: Math.max(400, (800 + Math.random() * 1000) - (currentStage * 50)),
                    lastAttackTime: 0,
                    color: `hsl(${Math.random() * 360}, 80%, 60%)`,
                    animOffset: Math.random() * Math.PI * 2
                };

                monsters.push(monster);
            }
        };

        function selectDifficulty(diff) {
            window.levelManager.setDifficulty(diff);
            startGameFromStage1();
        }

        function showDifficultySelect() {
            isGameRunning = false;
            gameOverScreen.style.display = 'none';
            stageClearScreen.style.display = 'none';
            difficultySelectScreen.style.display = 'flex';
        }

        function startGameFromStage1() {
            currentStage = 1;
            startStage(currentStage);
        }

        function startStage(stageNum) {
            currentStage = stageNum;
            stageTimer = SURVIVAL_TIME;
            stageTimeAccumulator = 0;

            const config = window.levelManager.getDifficultyConfig();

            const baseSpawnRate = Math.max(400, 1500 - (currentStage - 1) * 200);
            monsterSpawner.spawnRate = baseSpawnRate * config.spawnRateModifier;

            player.maxHp = config.playerMaxHp;

            window.skillManager.reset();
            window.dashManager.reset();
            window.takeDamageManager.reset();

            resetGame();

            difficultySelectScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            stageClearScreen.style.display = 'none';

            isGameRunning = true;
            logAction(`[${config.name}] STAGE ${currentStage} 시작! 1분간 생존하세요.`);
        }

        function nextStage() {
            if (currentStage < TOTAL_STAGES) {
                startStage(currentStage + 1);
            } else {
                logAction("축하합니다! 모든 스테이지를 클리어했습니다!");
                showDifficultySelect();
            }
        }

        function retryCurrentStage() {
            startStage(currentStage);
        }

        function logAction(message) {
            const div = document.createElement('div');
            div.textContent = message;
            actionLog.appendChild(div);
            if (actionLog.children.length > 5) {
                actionLog.removeChild(actionLog.firstChild);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (!isGameRunning || isGameOver) return;
            const key = e.key.toLowerCase();
            if (['w', 'a', 's', 'd'].includes(key)) input[key] = true;

            if (key === 'q') {
                if (!input.q) {
                    if (window.skillManager.useUltimate()) {
                        logAction(`궁극기(Q) 시전! (남은 횟수: ${window.skillManager.getRemainingCount()})`);
                        triggerUltimate();
                    } else {
                        logAction("궁극기 횟수를 모두 소진했습니다!");
                    }
                }
                input.q = true;
            }

            if (e.code === 'ShiftLeft' || key === 'shift') {
                if (!input.shift) {
                    if (window.dashManager.triggerDash(performance.now())) {
                        logAction("대시(Shift) 사용! 무적 상태!");
                    }
                }
                input.shift = true;
            }

            if (['1', '2', '3', '4', '5'].includes(key)) {
                if (!input.skills[key]) { logAction(`스킬 ${key}번 사용!`); triggerSkill(key); }
                input.skills[key] = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (['w', 'a', 's', 'd'].includes(key)) input[key] = false;
            if (key === 'q') input.q = false;
            if (e.code === 'ShiftLeft' || key === 'shift') input.shift = false;
            if (['1', '2', '3', '4', '5'].includes(key)) input.skills[key] = false;
        });

        canvas.addEventListener('mousedown', (e) => {
            if (!isGameRunning || isGameOver) return;
            if (e.button === 0) {
                input.mouseLeft = true;
                logAction("일반 공격 발사!");
                fireProjectile(e);
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (e.button === 0) input.mouseLeft = false;
        });

        function fireProjectile(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const angle = Math.atan2(mouseY - player.y, mouseX - player.x);
            projectiles.push({
                x: player.x,
                y: player.y,
                vx: Math.cos(angle) * 7,
                vy: Math.sin(angle) * 7,
                radius: 5,
                color: '#00ffcc'
            });
        }

        function triggerUltimate() {
            for (let i = 0; i < 36; i++) {
                const angle = (i * 10) * Math.PI / 180;
                particles.push({
                    x: player.x,
                    y: player.y,
                    vx: Math.cos(angle) * 5,
                    vy: Math.sin(angle) * 5,
                    life: 30,
                    maxLife: 30,
                    color: '#ff00ff',
                    radius: 4
                });
            }
            monsters = [];
            logAction("궁극기가 전장을 휩쓸었습니다!");
        }

        function triggerSkill(slot) {
            const colors = ['#ff3333', '#33ff33', '#3333ff', '#ffff33', '#33ffff'];
            const color = colors[slot - 1] || '#ffffff';
            for (let i = 0; i < 12; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 4;
                particles.push({
                    x: player.x,
                    y: player.y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 20,
                    maxLife: 20,
                    color: color,
                    radius: 6 - slot * 0.5
                });
            }
        }

        function gameLoop(currentTime) {
            if (!lastTime) lastTime = currentTime;
            let elapsed = currentTime - lastTime;
            lastTime = currentTime;

            accumulator += elapsed;
            while (accumulator >= timeStep) {
                if (isGameRunning && !isGameOver) {
                    updateGame(currentTime, timeStep);
                }
                accumulator -= timeStep;
            }

            frameCount++;
            if (currentTime - fpsLastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                fpsLastTime = currentTime;
                fpsCounter.textContent = `FPS: ${fps}`;
            }

            renderGame(currentTime);
            requestAnimationFrame(gameLoop);
        }

        function updateGame(currentTime, delta) {
            stageTimeAccumulator += delta;
            if (stageTimeAccumulator >= 1000) {
                stageTimer--;
                stageTimeAccumulator -= 1000;

                if (stageTimer <= 0) {
                    stageTimer = 0;
                    stageClear();
                }
            }

            const min = String(Math.floor(stageTimer / 60)).padStart(2, '0');
            const sec = String(stageTimer % 60).padStart(2, '0');
            stageTimerUI.textContent = `STAGE ${currentStage} - ${min}:${sec}`;

            const remainingUlt = window.skillManager.getRemainingCount();
            const dashCd = window.dashManager.getRemainingCooldown(currentTime);
            const dashText = dashCd > 0 ? `${dashCd}초` : 'READY';
            skillStatusUI.textContent = `궁극기(Q): ${remainingUlt}/3 | 대시(Shift): ${dashText}`;

            player.speed = player.baseSpeed * window.dashManager.getSpeedModifier();

            if (input.w) player.y -= player.speed;
            if (input.s) player.y += player.speed;
            if (input.a) player.x -= player.speed;
            if (input.d) player.x += player.speed;

            player.x = Math.max(player.radius, Math.min(WIDTH - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(HEIGHT - player.radius, player.y));
            player.pulseTimer += 0.05;

            monsterSpawner.update(currentTime);

            for (let i = monsters.length - 1; i >= 0; i--) {
                let m = monsters[i];
                let dx = player.x - m.x;
                let dy = player.y - m.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 0) {
                    m.x += (dx / dist) * m.speed;
                    m.y += (dy / dist) * m.speed;
                }

                if (currentTime - m.lastAttackTime >= m.attackRate) {
                    m.lastAttackTime = currentTime;
                    let attackAngle = Math.atan2(dy, dx);
                    projectiles.push({
                        x: m.x,
                        y: m.y,
                        vx: Math.cos(attackAngle) * 3.5,
                        vy: Math.sin(attackAngle) * 3.5,
                        radius: 4,
                        color: '#ff4d4d',
                        isMonsterAttack: true
                    });
                }

                if (dist < player.radius + m.radius) {
                    playerDamage(10);
                    monsters.splice(i, 1);
                }
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > WIDTH || p.y < 0 || p.y > HEIGHT) {
                    projectiles.splice(i, 1);
                    continue;
                }

                if (p.isMonsterAttack) {
                    let dx = p.x - player.x;
                    let dy = p.y - player.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < player.radius + p.radius) {
                        playerDamage(15);
                        projectiles.splice(i, 1);
                    }
                } else {
                    for (let j = monsters.length - 1; j >= 0; j--) {
                        let m = monsters[j];
                        let dx = p.x - m.x;
                        let dy = p.y - m.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < m.radius + p.radius) {
                            createHitEffect(m.x, m.y, m.color);
                            monsters.splice(j, 1);
                            projectiles.splice(i, 1);
                            break;
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            playerStats.textContent = `HP: ${Math.max(0, player.hp)} / ${player.maxHp}`;
        }

        function createHitEffect(x, y, color) {
            for (let i = 0; i < 6; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = 1 + Math.random() * 3;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    life: 15, maxLife: 15, radius: 3, color: color
                });
            }
        }

        function playerDamage(amount) {
            if (isGameOver || !isGameRunning) return;

            // 대시 무적 또는 피격 후 무적 시 데미지 무시
            if (window.dashManager.isInvincible() || window.takeDamageManager.checkInvincible()) {
                return;
            }

            const config = window.levelManager.getDifficultyConfig();
            const actualDamage = Math.round(amount * config.hpMultiplier);

            player.hp -= actualDamage;
            logAction(`피해를 입었습니다! -${actualDamage} HP`);

            // 피격 무적 발동 (1초간 무적)
            window.takeDamageManager.triggerHit(performance.now());

            if (player.hp <= 0) {
                player.hp = 0;
                isGameOver = true;
                isGameRunning = false;
                gameOverScreen.style.display = 'flex';
                logAction("게임 오버! 플레이어가 쓰러졌습니다.");
            }
        }

        function stageClear() {
            isGameRunning = false;
            document.getElementById('clear-message').textContent = `STAGE ${currentStage} 클리어 성공!`;
            stageClearScreen.style.display = 'flex';
            logAction(`STAGE ${currentStage} 성공!`);
        }

        // SVG 렌더링
        function renderGame(currentTime) {
            renderGroup.innerHTML = '';

            const currentRadius = player.radius + Math.sin(player.pulseTimer) * 2;
            const playerSvg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            playerSvg.setAttribute("cx", player.x);
            playerSvg.setAttribute("cy", player.y);
            playerSvg.setAttribute("r", currentRadius);

            const isDashInvincible = window.dashManager.isInvincible();
            const isHitInvincible = window.takeDamageManager.checkInvincible();
            const isVisible = window.takeDamageManager.isVisible(currentTime);

            // 상태별 플레이어 그래픽 변경 (대시 / 피격 깜빡임 / 일반)
            if (isDashInvincible) {
                playerSvg.setAttribute("fill", "#00ffff");
                playerSvg.setAttribute("opacity", "0.6");
                playerSvg.setAttribute("stroke", "#ffffff");
                playerSvg.setAttribute("stroke-width", "4");
            } else if (isHitInvincible) {
                playerSvg.setAttribute("fill", "#ff4d4d");
                playerSvg.setAttribute("opacity", isVisible ? "0.9" : "0.2"); // 깜빡임 효과
                playerSvg.setAttribute("stroke", "#ffffff");
                playerSvg.setAttribute("stroke-width", "2");
            } else {
                playerSvg.setAttribute("fill", "#00ffcc");
                playerSvg.setAttribute("opacity", "1.0");
                playerSvg.setAttribute("stroke", "#ffffff");
                playerSvg.setAttribute("stroke-width", "2");
            }
            renderGroup.appendChild(playerSvg);

            const playerCore = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            playerCore.setAttribute("cx", player.x);
            playerCore.setAttribute("cy", player.y);
            playerCore.setAttribute("r", currentRadius * 0.4);
            playerCore.setAttribute("fill", "#ffffff");
            playerCore.setAttribute("opacity", (isHitInvincible && !isVisible) ? "0.2" : "1.0");
            renderGroup.appendChild(playerCore);

            monsters.forEach(m => {
                const bounce = Math.abs(Math.sin((currentTime * 0.005) + m.animOffset)) * 4;
                const monsterG = document.createElementNS("http://www.w3.org/2000/svg", "g");
                const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                const r = m.radius + bounce;
                const points = `${m.x},${m.y - r} ${m.x - r},${m.y + r / 2} ${m.x + r},${m.y + r / 2}`;
                polygon.setAttribute("points", points);
                polygon.setAttribute("fill", m.color);
                polygon.setAttribute("stroke", "#111");
                polygon.setAttribute("stroke-width", "1.5");

                monsterG.appendChild(polygon);
                renderGroup.appendChild(monsterG);
            });

            projectiles.forEach(p => {
                const proj = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                proj.setAttribute("cx", p.x);
                proj.setAttribute("cy", p.y);
                proj.setAttribute("r", p.radius);
                proj.setAttribute("fill", p.color);
                renderGroup.appendChild(proj);
            });

            particles.forEach(p => {
                const part = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                part.setAttribute("cx", p.x);
                part.setAttribute("cy", p.y);
                part.setAttribute("r", p.radius * (p.life / p.maxLife));
                part.setAttribute("fill", p.color);
                part.setAttribute("opacity", p.life / p.maxLife);
                renderGroup.appendChild(part);
            });
        }

        function resetGame() {
            player.x = WIDTH / 2;
            player.y = HEIGHT / 2;
            player.hp = player.maxHp;
            monsters = [];
            projectiles = [];
            particles = [];
            isGameOver = false;
        }

        requestAnimationFrame(gameLoop);
    </script>

</body>

</html>
