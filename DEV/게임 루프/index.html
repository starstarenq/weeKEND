<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Component Lab - Integrated Simulation</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif;
      background: #080d17;
      color: #eef4ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 0%, rgba(61, 113, 255, .16), transparent 34rem),
        #080d17;
    }

    main {
      width: min(1120px, 100%);
      padding: 28px;
    }

    .heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .header-left {
      display: flex;
      flex-direction: column;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-skill-ui {
      width: 200px;
      height: 54px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 4vw, 38px);
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 0;
      color: #8fa1bd;
      font-size: 14px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #a9b9cf;
      font-size: 13px;
      white-space: nowrap;
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #5cf2a5;
      box-shadow: 0 0 12px #5cf2a5;
    }

    /* ----------------------------------
       화면 관리 (Screen System)
    ---------------------------------- */
    .screen {
      display: none;
      width: 100%;
      margin-top: 20px;
    }

    .screen.active {
      display: block;
    }

    .card-screen {
      border: 1px solid #1d2a40;
      border-radius: 18px;
      background: rgba(12, 20, 34, .92);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .32);
      padding: 48px 24px;
      text-align: center;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card-screen h2 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #f8fafc;
    }

    .card-screen p {
      color: #8fa1bd;
      margin-bottom: 24px;
    }

    /* 스테이지 선택 버튼 배치 */
    #stage-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .stage-btn {
      width: auto;
      min-width: 140px;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .stage-btn:hover {
      background: #315fd7;
      border-color: #60a5fa;
      transform: translateY(-2px);
    }

    .action-btn {
      width: auto;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      background: #315fd7;
      border: 1px solid #5382ff;
      color: #ffffff;
      cursor: pointer;
    }

    .action-btn:hover {
      background: #4272f5;
    }

    /* ----------------------------------
       플레이 화면 레이아웃
    ---------------------------------- */
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 230px;
      gap: 16px;
    }

    .stage,
    .panel {
      border: 1px solid #1d2a40;
      border-radius: 18px;
      background: rgba(12, 20, 34, .92);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .32);
    }

    .stage {
      position: relative;
      overflow: hidden;
      min-height: 500px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 500px;
      cursor: crosshair;
    }

    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .ui-overlay svg * {
      pointer-events: auto;
    }

    .hint {
      position: absolute;
      left: 16px;
      bottom: 14px;
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 9px;
      color: #b6c5da;
      background: rgba(4, 9, 17, .72);
      font-size: 12px;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .panel {
      padding: 18px;
    }

    .panel h2 {
      margin: 0 0 14px;
      color: #8fa1bd;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .metric {
      padding: 12px 0;
      border-bottom: 1px solid #1b273b;
    }

    .metric:last-of-type {
      border: 0;
    }

    .label {
      color: #7f91ac;
      font-size: 12px;
    }

    .value {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 11px 14px;
      border: 1px solid #2d4265;
      border-radius: 10px;
      color: #dce8f8;
      background: #17243a;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #203250;
    }

    .legend {
      display: grid;
      gap: 9px;
      margin-top: 18px;
      color: #8fa1bd;
      font-size: 12px;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 7px;
      border-radius: 50%;
    }

    @media (max-width: 760px) {
      main {
        padding: 16px;
      }

      .heading {
        align-items: start;
        flex-direction: column;
      }

      .header-right {
        width: 100%;
        justify-content: space-between;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .stage,
      canvas {
        min-height: 420px;
        height: 420px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="heading">
      <div class="header-left">
        <h1>Game Component Lab</h1>
        <p class="subtitle">수정된 엔티티 컴포넌트와 SVG UI가 통합된 시스템</p>
      </div>
      <div class="header-right">
        <div id="header-ui-container" class="header-skill-ui"></div>
        <div class="status" id="status-indicator">SIMULATION RUNNING</div>
      </div>
    </header>

    <!-- 1. 시작 화면 -->
    <section id="start-screen" class="screen card-screen active">
      <h2>Game Simulation</h2>
      <p>스테이지 선택 후 시뮬레이션을 시작하세요.</p>
      <button class="action-btn" onclick="window.StageManager.changeStage('SELECT')">시작하기</button>
    </section>

    <!-- 2. 스테이지 선택 화면 -->
    <section id="select-screen" class="screen card-screen">
      <h2>스테이지 선택</h2>
      <p>도전할 스테이지를 선택하세요.</p>
      <div id="stage-buttons"></div>
    </section>

    <!-- 3. 플레이 화면 -->
    <section id="play-screen" class="screen">
      <section class="layout">
        <div class="stage">
          <canvas id="game" aria-label="플레이어, 몬스터, NPC 시뮬레이션"></canvas>
          <div id="ui-container" class="ui-overlay"></div>
          <div class="hint">WASD / 방향키 이동 · Space 대시 · Q 스킬 사용 · ESC 일시정지</div>
        </div>
        <aside class="panel">
          <h2 id="current-stage-title">Stage</h2>
          <div class="metric">
            <div class="label">프레임</div>
            <div class="value" id="fps">0 FPS</div>
          </div>
          <div class="metric">
            <div class="label">플레이어 속도</div>
            <div class="value" id="speed">0 px/s</div>
          </div>
          <div class="metric">
            <div class="label">충돌 횟수 (최대 5회)</div>
            <div class="value" id="hits">0</div>
          </div>
          <button id="reset" type="button">시뮬레이션 재시작</button>
          <button id="giveup-btn" type="button" style="margin-top: 8px; background: #3f1d24; border-color: #7f2332;" onclick="window.StageManager.completeStage(false)">포기하기</button>
          <div class="legend">
            <div><span class="dot" style="background:#69a8ff"></span>Player</div>
            <div><span class="dot" style="background:#ff6d78"></span>Monster</div>
            <div><span class="dot" style="background:#4ade80"></span>NPC</div>
            <div><span class="dot" style="background:#a855f7"></span>Stasis Bullet</div>
          </div>
        </aside>
      </section>
    </section>

    <!-- 4. 결과 화면 -->
    <section id="result-screen" class="screen card-screen">
      <h2 id="result-message">플레이 결과</h2>
      <div style="display: flex; gap: 12px; margin-top: 18px;">
        <button class="action-btn" onclick="window.StageManager.changeStage('PLAY', window.StageManager.selectedStage)">다시하기</button>
        <button class="action-btn" style="background: #1e293b; border-color: #334155;" onclick="window.StageManager.changeStage('SELECT')">스테이지 목록</button>
      </div>
    </section>
  </main>

  <!-- 코어 게임 컴포넌트 -->
  <script src="./component/rendering.js"></script>
  <script src="./component/animation.js"></script>
  <script src="./component/collision.js"></script>
  <script src="./component/physics.js"></script>
  <script src="./component/game-loop.js"></script>

  <!-- 엔티티 스크립트 -->
  <script src="./player.js"></script>
  <script src="./monster.js"></script>
  <script src="./npc.js"></script>
  <script src="./skill.js"></script>

  <!-- SVG UI 컴포넌트 -->
  <script src="./component/UIElement.js"></script>
  <script src="./component/UIImage.js"></script>
  <script src="./component/UIText.js"></script>
  <script src="./component/UIButton.js"></script>
  <script src="./component/UIBase.js"></script>
  <script src="./component/SubUI.js"></script>
  <script src="./component/SceneUI.js"></script>
  <script src="./component/PopupUI.js"></script>
  <script src="./component/SkillUI.js"></script>

  <!-- 메인 스크립트 및 StageManager 연동 -->
  <script>
    (() => {
      "use strict";

      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const fpsNode = document.querySelector("#fps");
      const speedNode = document.querySelector("#speed");
      const hitsNode = document.querySelector("#hits");
      const keys = new Set();

      let player, monster, npc, skillManager;
      let hitCount = 0;
      let collisionCooldown = 0;
      let pulse = 0;
      let isPaused = false;
      let loop = null;

      const { UI } = window.GameComponents;

      // ----------------------------------
      // 전역 StageManager 통합 정의
      // ----------------------------------
      window.StageManager = {
        currentStatus: 'START',
        selectedStage: null,
        totalStages: 3,

        init: function() {
          this.renderSelectScreen();
          this.updateDOM();
        },

        changeStage: function(nextStatus, stageNum = null) {
          this.currentStatus = nextStatus;
          if (stageNum !== null) {
            this.selectedStage = stageNum;
          }
          this.updateDOM();

          if (this.currentStatus === 'PLAY') {
            resize();
            resetGame();
            if (loop && !loop.running) loop.start();
          } else {
            if (loop) loop.stop();
          }
        },

        renderSelectScreen: function() {
          const container = document.getElementById('stage-buttons');
          if (!container) return;
          container.innerHTML = '';

          for (let i = 1; i <= this.totalStages; i++) {
            const btn = document.createElement('button');
            btn.className = 'stage-btn';
            btn.innerText = `스테이지 ${i}`;
            btn.onclick = () => this.changeStage('PLAY', i);
            container.appendChild(btn);
          }
        },

        completeStage: function(isSuccess) {
          const message = isSuccess
            ? `🎉 스테이지 ${this.selectedStage} 클리어 성공!`
            : `💀 스테이지 ${this.selectedStage} 플레이 실패...`;

          document.getElementById('result-message').innerText = message;
          this.changeStage('RESULT');
        },

        updateDOM: function() {
          document.getElementById('start-screen').classList.remove('active');
          document.getElementById('select-screen').classList.remove('active');
          document.getElementById('play-screen').classList.remove('active');
          document.getElementById('result-screen').classList.remove('active');

          if (this.currentStatus === 'START') {
            document.getElementById('start-screen').classList.add('active');
          } else if (this.currentStatus === 'SELECT') {
            document.getElementById('select-screen').classList.add('active');
          } else if (this.currentStatus === 'PLAY') {
            document.getElementById('current-stage-title').innerText = `스테이지 ${this.selectedStage} 플레이 중`;
            document.getElementById('play-screen').classList.add('active');
          } else if (this.currentStatus === 'RESULT') {
            document.getElementById('result-screen').classList.add('active');
          }
        }
      };

      // 팝업 UI 클래스 정의
      class ConfirmPopupUI extends UI.PopupUI {
        constructor({ scene, onConfirm, onCancel }) {
          super({ scene, width: 320, height: 180, dim: true, closeOnBackdrop: false, name: "confirm-reset-popup" });
          const width = 320;
          const height = 180;

          this.content.add(new UI.UIImage({ width: width, height: height, fill: "#0f172a", radius: 16 }));
          this.content.add(new UI.UIText({ x: width / 2, y: 65, text: "초기화하시겠습니까?", fontSize: 18, fill: "#f8fafc", weight: 700, align: "middle" }));

          this.content.add(new UI.UIButton({
            x: 24, y: 110, width: 128, height: 42, label: "아니요", fill: "#17243a", hoverFill: "#203250",
            onClick: () => {
              this.scene.closePopup(this);
              if (typeof onCancel === "function") onCancel();
            }
          }));

          this.content.add(new UI.UIButton({
            x: 168, y: 110, width: 128, height: 42, label: "예", fill: "#315fd7", hoverFill: "#4272f5",
            onClick: () => {
              this.scene.closePopup(this);
              if (typeof onConfirm === "function") onConfirm();
            }
          }));
        }
      }

      class GameMenuPopup extends UI.PopupUI {
        constructor({ scene, onResume, onResetRequest }) {
          super({ scene, width: 280, height: 220, dim: true, name: "pause-menu" });

          this.content.add(new UI.UIImage({ width: 280, height: 220, fill: "#0f172a", radius: 16 }));
          this.content.add(new UI.UIText({ x: 140, y: 40, text: "PAUSED", fontSize: 18, fill: "#f8fafc", weight: 700, align: "middle" }));

          this.content.add(new UI.UIButton({
            x: 40, y: 75, width: 200, height: 42, label: "게임 계속하기", fill: "#315fd7", hoverFill: "#4272f5",
            onClick: () => onResume()
          }));

          this.content.add(new UI.UIButton({
            x: 40, y: 130, width: 200, height: 42, label: "시뮬레이션 재시작", fill: "#17243a", hoverFill: "#203250",
            onClick: () => {
              onResume();
              onResetRequest();
            }
          }));
        }
      }

      const mainSceneUI = new UI.SceneUI({ container: "#ui-container", name: "MainHUD" }).mount();
      const headerSceneUI = new UI.SceneUI({ container: "#header-ui-container", name: "HeaderSkillHUD" }).mount();
      const skillWidget = new UI.SkillUI({ x: 0, y: 0, width: 200, height: 54, name: "SkillWidget" }).attachTo(headerSceneUI);

      let pausePopup = null;

      function openResetConfirmModal() {
        const confirmPopup = new ConfirmPopupUI({
          scene: mainSceneUI,
          onConfirm: () => resetGame()
        });
        mainSceneUI.openPopup(confirmPopup);
      }

      function togglePause() {
        isPaused = !isPaused;
        if (isPaused) {
          pausePopup = new GameMenuPopup({
            scene: mainSceneUI,
            onResume: () => togglePause(),
            onResetRequest: () => openResetConfirmModal()
          });
          mainSceneUI.openPopup(pausePopup);
        } else {
          if (pausePopup) {
            mainSceneUI.closePopup(pausePopup);
            pausePopup = null;
          }
        }
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * ratio);
        canvas.height = Math.round(rect.height * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function resetGame() {
        const bounds = { width: canvas.clientWidth || 800, height: canvas.clientHeight || 500 };
        player = new window.Player({ x: bounds.width * .24, y: bounds.height * .5 });
        monster = new window.Monster({ x: bounds.width * .72, y: bounds.height * .5 });

        const waypoints = [
          { x: 80, y: 80 },
          { x: bounds.width - 80, y: 80 },
          { x: bounds.width - 80, y: bounds.height - 80 },
          { x: 80, y: bounds.height - 80 }
        ];
        npc = new window.Npc({ x: 80, y: 80, waypoints });
        skillManager = new window.SkillManager({ cooldown: 3.0 });

        hitCount = 0;
        pulse = 0;
        hitsNode.textContent = "0";
      }

      function update(dt) {
        if (isPaused || window.StageManager.currentStatus !== 'PLAY') return;

        const bounds = { width: canvas.clientWidth, height: canvas.clientHeight };

        player.update(dt, keys, bounds);
        monster.update(dt, player, bounds);
        npc.update(dt, bounds);
        skillManager.update(dt, bounds, [player, monster, npc]);

        skillWidget.updateCooldown(skillManager.currentCooldown, skillManager.cooldown);

        collisionCooldown = Math.max(0, collisionCooldown - dt);

        const collisionModule = window.GameComponents.collision;
        const contactPM = collisionModule.resolveCircleCollision(player, monster, .82);
        if (contactPM.collided) {
          pulse = 1;
          player.onCollision(contactPM.normal);
          monster.onCollision({ x: -contactPM.normal.x, y: -contactPM.normal.y });
          if (collisionCooldown === 0) {
            hitCount += 1;
            hitsNode.textContent = String(hitCount);
            collisionCooldown = .24;

            // 충돌 5회 누적 시 실패 처리 연동
            if (hitCount >= 5) {
              window.StageManager.completeStage(false);
            }
          }
        }

        const contactPN = collisionModule.resolveCircleCollision(player, npc, .82);
        if (contactPN.collided) {
          player.onCollision(contactPN.normal);
          npc.onCollision({ x: -contactPN.normal.x, y: -contactPN.normal.y });
        }

        const contactMN = collisionModule.resolveCircleCollision(monster, npc, .82);
        if (contactMN.collided) {
          monster.onCollision(contactMN.normal);
          npc.onCollision({ x: -contactMN.normal.x, y: -contactMN.normal.y });
        }

        pulse = Math.max(0, pulse - dt * 2.7);
      }

      // 스테이지별 동적 배경 연출
      function drawBackground(width, height) {
        ctx.save();
        const stage = window.StageManager.selectedStage || 1;

        if (stage === 1) {
          if (window.GameComponents.rendering && window.GameComponents.rendering.drawArena) {
            window.GameComponents.rendering.drawArena(ctx, width, height);
          } else {
            ctx.fillStyle = "#09111e";
            ctx.fillRect(0, 0, width, height);
          }
        } else if (stage === 2) {
          const grad = ctx.createLinearGradient(0, 0, width, height);
          grad.addColorStop(0, "#031329");
          grad.addColorStop(1, "#082142");
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, width, height);

          ctx.strokeStyle = "rgba(40, 140, 255, 0.12)";
          ctx.lineWidth = 1;
          for (let x = 0; x < width + height; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x - height, height);
            ctx.stroke();
          }
        } else if (stage === 3) {
          const radial = ctx.createRadialGradient(
            width / 2, height / 2, 50,
            width / 2, height / 2, Math.max(width, height) / 1.2
          );
          radial.addColorStop(0, "#2a0a12");
          radial.addColorStop(0.7, "#140508");
          radial.addColorStop(1, "#080204");
          ctx.fillStyle = radial;
          ctx.fillRect(0, 0, width, height);

          ctx.strokeStyle = "rgba(255, 70, 70, 0.1)";
          ctx.lineWidth = 1.5;
          const maxRadius = Math.max(width, height);
          for (let r = 60; r < maxRadius; r += 70) {
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, r, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      function render() {
        if (window.StageManager.currentStatus !== 'PLAY') return;

        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        const rendering = window.GameComponents.rendering;

        drawBackground(width, height);

        if (monster.trail) rendering.drawTrail(ctx, monster.trail, "#ff6574");
        if (player.trail) rendering.drawTrail(ctx, player.trail, "#65a8ff");
        if (npc.trail) rendering.drawTrail(ctx, npc.trail, "#4ade80");

        skillManager.render(ctx);
        monster.render(ctx);
        player.render(ctx);
        npc.render(ctx);

        if (pulse > 0) {
          const x = (player.x + monster.x) / 2;
          const y = (player.y + monster.y) / 2;
          rendering.drawPulse(ctx, x, y, pulse);
        }
      }

      loop = new window.GameComponents.GameLoop(update, render, ({ fps }) => {
        fpsNode.textContent = `${Math.round(fps)} FPS`;
        speedNode.textContent = `${Math.round(Math.hypot(player.vx, player.vy))} px/s`;
      });

      window.addEventListener("resize", () => {
        if (window.StageManager.currentStatus === 'PLAY') {
          resize();
          resetGame();
        }
      });

      window.addEventListener("keydown", (event) => {
        if (window.StageManager.currentStatus !== 'PLAY') return;

        if (event.code === "KeyQ" && !isPaused) {
          skillManager.useSkill(player);
        }
        if (event.code === "Escape" || event.code === "KeyP") {
          togglePause();
        }

        keys.add(event.code);
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(event.code)) {
          event.preventDefault();
        }
      });

      window.addEventListener("keyup", (event) => keys.delete(event.code));
      window.addEventListener("blur", () => keys.clear());

      document.querySelector("#reset").addEventListener("click", openResetConfirmModal);

      // StageManager 초기화 실행
      window.StageManager.init();
    })();
  </script>
</body>

</html>
